defaultRules:
  create: true

grafana:
  enabled: true

  adminUser: admin

  service:
    type: ClusterIP

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus:
  enabled: true

  prometheusSpec:
    replicas: 2

    retention: 14d

    scrapeInterval: 15s
    evaluationInterval: 30s

    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

    externalLabels:
      cluster: go-web-app-sre-dev
      environment: dev

    # Select ServiceMonitors across the cluster.
    serviceMonitorSelector: {}

    serviceMonitorNamespaceSelector: {}

    # Important: an empty selector should really mean
    # "select all ServiceMonitors", not only Helm-created ones.
    serviceMonitorSelectorNilUsesHelmValues: false

    # Select PrometheusRule resources across the cluster.
    ruleSelector: {}

    ruleNamespaceSelector: {}

    enableAdminAPI: false

alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by:
        - alertname
        - namespace
        - severity

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      receiver: "null"

    receivers:
      - name: "null"

  alertmanagerSpec:
    replicas: 2

    podAntiAffinity: hard

    podAntiAffinityTopologyKey: kubernetes.io/hostname

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

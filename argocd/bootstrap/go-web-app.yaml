apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-web-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: go-web-app-platform

  source:
    repoURL: https://github.com/Utk2022/go-web-app-gitops.git
    targetRevision: master
    path: apps/go-web-app

    helm:
      releaseName: go-web-app
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: go-web-app

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: go-web-app
      namespace: go-web-app
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

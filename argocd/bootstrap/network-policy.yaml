apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-web-app-network-policy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: go-web-app-platform

  source:
    repoURL: https://github.com/Utk2022/go-web-app-gitops.git
    targetRevision: master
    path: platform/network-policy

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: go-web-app

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
